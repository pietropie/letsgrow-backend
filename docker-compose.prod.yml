version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - letsgrow_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - letsgrow_net

  # Sem anônimo: ver mosquitto.conf e mosquitto/entrypoint.sh (dynamic-security).
  # A 1883 publicada exige login; para TLS use o docker-compose.coolify.yml.
  mosquitto:
    build:
      context: .
      dockerfile: mosquitto/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?}
    volumes:
      - mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"
    networks:
      - letsgrow_net

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - letsgrow_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: letsgrow-backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      # Host PÚBLICO usado para gerar as URLs de upload/download que vão pro
      # app mobile (precisa ser resolvível pela internet — "minio" não é).
      # Defina MINIO_PUBLIC_ENDPOINT (e opcionalmente MINIO_PUBLIC_SECURE) no
      # .env do servidor / variáveis do Coolify com o domínio ou IP:porta
      # público real do MinIO.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-exp}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - letsgrow_net

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - letsgrow_net

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  minio_data:

networks:
  letsgrow_net:
    driver: bridge
