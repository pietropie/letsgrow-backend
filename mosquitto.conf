# Broker MQTT dos Hubs ESP32 (dev, prod e Coolify).
# Copiado para a imagem por mosquitto/Dockerfile.
#
# Usuários e ACL no plugin dynamic-security (Mosquitto 2): o arquivo
# /mosquitto/data/dynamic-security.json fica no volume de dados. O usuário do
# backend (letsgrow-backend) e a role dele são refeitos a cada subida por
# mosquitto/entrypoint.sh a partir de MQTT_BACKEND_PASSWORD; os Hubs são criados
# em tempo real pelo backend (POST /api/v1/iot/hubs/activate) via
# $CONTROL/dynamic-security/v1. Nenhuma credencial fica neste repositório.

per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Payloads do Hub são JSON pequenos; 64 KiB sobra.
message_size_limit 65536
max_queued_messages 1000

# Sem TLS aqui: na produção o TLS (8883) termina no Traefik do Coolify, que
# repassa a conexão já decifrada para esta porta pela rede interna do Docker.
# A porta 1883 não é publicada no host em produção.
listener 1883
