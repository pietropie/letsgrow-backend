version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: letsgrow
      POSTGRES_PASSWORD: letsgrow_dev
      POSTGRES_DB: letsgrow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letsgrow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: letsgrow
      MINIO_ROOT_PASSWORD: letsgrow_dev
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://letsgrow:letsgrow_dev@postgres:5432/letsgrow
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: letsgrow
      MINIO_SECRET_KEY: letsgrow_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://letsgrow:letsgrow_dev@postgres:5432/letsgrow
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app worker --loglevel=info

volumes:
  postgres_data:
  minio_data:
